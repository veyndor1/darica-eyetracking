name: Hata Raporu
description: Bir hata bildirin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Hata raporunuz icin tesekkurler. Asagidaki bilgileri mumkun oldugunca eksiksiz doldurun.

  - type: textarea
    id: description
    attributes:
      label: Hata Aciklamasi
      description: Hatanin ne oldugunu kisaca anlatın.
      placeholder: Program baslatildiginda kalibrasyon ekrani acilmiyor...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Yeniden Uretme Adimlari
      description: Hatayi nasil yeniden uretebiliriz?
      placeholder: |
        1. Programi calistirin: `python gazetracking.py`
        2. Kalibrasyonu tamamlayin
        3. Mouse hareketi basladiginda...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Beklenen Davranis
      description: Ne olmasi gerekiyordu?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Gerceklesen Davranis
      description: Bunun yerine ne oldu?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Isletim Sistemi
      options:
        - Windows 11
        - Windows 10
        - Raspberry Pi OS
        - Ubuntu / Linux
        - Diger
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Surumu
      placeholder: "3.11.5"
    validations:
      required: true

  - type: input
    id: camera
    attributes:
      label: Kamera Modeli
      placeholder: "Dahili webcam / Logitech C920 / Pi Camera v2"

  - type: textarea
    id: logs
    attributes:
      label: Hata Ciktisi / Loglar
      description: Varsa hata mesajlarini yaristirin.
      render: shell
