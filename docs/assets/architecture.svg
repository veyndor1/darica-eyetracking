<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="tealBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a"/>
      <stop offset="100%" style="stop-color:#0f3d3a"/>
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78350f"/>
      <stop offset="100%" style="stop-color:#5c2d0e"/>
    </linearGradient>
    <linearGradient id="slateBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#172554"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#archBg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="600">SYSTEM ARCHITECTURE</text>

  <!-- Camera Input -->
  <rect x="310" y="55" width="180" height="42" rx="8" fill="url(#tealBox)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="81" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#99f6e4" text-anchor="middle" font-weight="600">Camera Frame</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="97" x2="400" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="395,118 400,128 405,118" fill="#475569"/>

  <!-- MediaPipe -->
  <rect x="250" y="130" width="300" height="48" rx="8" fill="url(#slateBox)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="153" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle" font-weight="600">MediaPipe Face Landmarker</text>
  <text x="400" y="170" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">478 face landmarks + transformation matrix</text>

  <!-- Three outputs from MediaPipe -->
  <!-- Left branch: Iris -->
  <line x1="320" y1="178" x2="160" y2="220" stroke="#475569" stroke-width="1.5"/>
  <polygon points="155,217 162,225 166,215" fill="#475569"/>
  <rect x="70" y="225" width="180" height="38" rx="7" fill="url(#tealBox)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="248" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#5eead4" text-anchor="middle">Iris Position (468-477)</text>

  <!-- Center branch: Head -->
  <line x1="400" y1="178" x2="400" y2="220" stroke="#475569" stroke-width="1.5"/>
  <polygon points="395,218 400,228 405,218" fill="#475569"/>
  <rect x="310" y="225" width="180" height="38" rx="7" fill="url(#tealBox)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="248" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#5eead4" text-anchor="middle">Head Pose (Yaw/Pitch)</text>

  <!-- Right branch: EAR -->
  <line x1="480" y1="178" x2="640" y2="220" stroke="#475569" stroke-width="1.5"/>
  <polygon points="635,215 643,225 645,217" fill="#475569"/>
  <rect x="550" y="225" width="180" height="38" rx="7" fill="url(#tealBox)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="248" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#5eead4" text-anchor="middle">EAR (Eye Aspect Ratio)</text>

  <!-- Merge arrows to Calibration -->
  <line x1="160" y1="263" x2="320" y2="305" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="263" x2="400" y2="305" stroke="#475569" stroke-width="1.5"/>
  <polygon points="395,303 400,313 405,303" fill="#475569"/>

  <!-- Calibration Model -->
  <rect x="270" y="310" width="260" height="42" rx="8" fill="url(#slateBox)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="336" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" font-weight="600">Calibration (TPS + Ridge)</text>

  <!-- Arrow to Filter chain -->
  <line x1="400" y1="352" x2="400" y2="375" stroke="#475569" stroke-width="1.5"/>
  <polygon points="395,373 400,383 405,373" fill="#475569"/>

  <!-- Filter Chain -->
  <rect x="100" y="380" width="155" height="38" rx="7" fill="url(#tealBox)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="177" y="403" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">One Euro Filter</text>

  <text x="270" y="403" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" fill="#475569">&#8594;</text>

  <rect x="290" y="380" width="140" height="38" rx="7" fill="url(#tealBox)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="360" y="403" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">Kalman Filter</text>

  <text x="445" y="403" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" fill="#475569">&#8594;</text>

  <rect x="465" y="380" width="155" height="38" rx="7" fill="url(#tealBox)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="542" y="403" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">Adaptive Dead Zone</text>

  <!-- EAR arrow to Blink -->
  <line x1="640" y1="263" x2="640" y2="435" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="635,433 640,443 645,433" fill="#475569"/>

  <!-- Bottom outputs -->
  <!-- Mouse -->
  <line x1="270" y1="418" x2="200" y2="455" stroke="#475569" stroke-width="1.5"/>
  <polygon points="195,452 202,460 206,450" fill="#475569"/>
  <rect x="105" y="460" width="190" height="42" rx="8" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="486" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#fcd34d" text-anchor="middle" font-weight="600">Mouse Movement</text>

  <!-- Blink Detection -->
  <rect x="545" y="448" width="190" height="42" rx="8" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="464" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle" font-weight="600">Blink Detection</text>
  <text x="640" y="481" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Double blink = Click | Scan keyboard</text>
</svg>
