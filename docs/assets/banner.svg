<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#134e4a"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#2dd4bf;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bannerBg)" rx="12"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#2dd4bf" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
  </g>

  <!-- Glow line -->
  <rect x="0" y="118" width="900" height="4" fill="url(#glowGrad)"/>

  <!-- Eye icon -->
  <g transform="translate(120, 120)" filter="url(#glow)">
    <path d="M-50 0 Q0 -38 50 0 Q0 38 -50 0 Z" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="url(#irisGrad)" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#0f172a"/>
    <circle cx="-4" cy="-5" r="3" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="200" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f0fdfa" letter-spacing="-1">
    Darica Eye Tracking
  </text>

  <!-- Subtitle -->
  <text x="200" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#99f6e4" opacity="0.9">
    Webcam eye tracking, mouse control and scan keyboard
  </text>

  <!-- Feature pills -->
  <g transform="translate(200, 165)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#134e4a" opacity="0.7"/>
    <text x="52" y="17" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">MediaPipe</text>

    <rect x="115" y="0" width="80" height="26" rx="13" fill="#134e4a" opacity="0.7"/>
    <text x="155" y="17" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">Kalman</text>

    <rect x="205" y="0" width="95" height="26" rx="13" fill="#134e4a" opacity="0.7"/>
    <text x="252" y="17" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">Python 3.9+</text>

    <rect x="310" y="0" width="115" height="26" rx="13" fill="#134e4a" opacity="0.7"/>
    <text x="367" y="17" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">Raspberry Pi</text>

    <rect x="435" y="0" width="65" height="26" rx="13" fill="#134e4a" opacity="0.7"/>
    <text x="467" y="17" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">MIT</text>
  </g>

  <!-- Cursor icon -->
  <g transform="translate(810, 70)" opacity="0.3">
    <path d="M0 0 L0 30 L8 22 L14 34 L19 31 L13 19 L22 16 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.8"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="780" cy="180" r="2" fill="#2dd4bf" opacity="0.2"/>
  <circle cx="800" cy="160" r="1.5" fill="#2dd4bf" opacity="0.15"/>
  <circle cx="820" cy="190" r="1" fill="#2dd4bf" opacity="0.2"/>
  <circle cx="760" cy="200" r="1.5" fill="#2dd4bf" opacity="0.1"/>
  <circle cx="840" cy="170" r="2" fill="#2dd4bf" opacity="0.12"/>
</svg>
